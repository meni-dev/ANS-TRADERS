# Runs on every push and every pull request. Nothing here touches AWS, Cloudflare or the shop's
# database — it only answers "does this build, and do the rules still hold".
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  backend:
    name: Backend · build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Keyed on the lock-equivalent so a branch that changes no package restores from cache.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('backend/**/*.csproj', 'backend/**/Directory.Packages.props') }}
          restore-keys: nuget-

      - name: Test
        working-directory: backend
        run: dotnet test TwoWheelerSpareParts.slnx --nologo --configuration Release

  frontend:
    name: Frontend · lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # `npm run build` is `tsc -b && vite build`, so this is the type check as well. It is the step
      # that would have caught the four screens that crashed on open while the dev server stayed
      # quiet about them.
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          # Only so the build has something to inline. The real value is set in the deploy workflow.
          VITE_API_BASE_URL: https://api.invalid
